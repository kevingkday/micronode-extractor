version: '3.8'
services:
  micronode-extractor:
    build: .
    ports:
      - "5005:5005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434/api/generate
      - API_KEY=micronode-secret-key
    restart: unless-stopped

  litellm-router:
    image: ghcr.io/berriai/litellm:v1.108.6-lts
    container_name: micronode-router
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    restart: unless-stopped

  micronode-console:
    build: ./micronode-console
    container_name: micronode-console
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - LITELLM_URL=http://host.docker.internal:4000
      - LITELLM_API_KEY=sk-micronode-router-key
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
