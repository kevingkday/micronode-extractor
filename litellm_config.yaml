model_list:
  - model_name: micronode-vision
    litellm_params:
      model: ollama_chat/qwen2.5vl:7b
      api_base: http://host.docker.internal:11434

  - model_name: micronode-decision
    litellm_params:
      model: ollama_chat/deepseek-r1:8b
      api_base: http://host.docker.internal:11434

  - model_name: micronode-chat
    litellm_params:
      model: ollama_chat/qwen2.5:7b-instruct
      api_base: http://host.docker.internal:11434

  - model_name: micronode-embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://host.docker.internal:11434

litellm_settings:
  drop_params: true
  set_verbose: false

router_settings:
  routing_strategy: simple-shuffle
  fallbacks:
    - {"micronode-decision": ["micronode-chat"]}

general_settings:
  master_key: sk-micronode-router-key
